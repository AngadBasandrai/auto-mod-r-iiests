name: reindex

# Re-pull the subreddit's own knowledge and rebuild the search index.
# Manual only -- the WhatsApp half of the corpus is built locally (the raw
# export never leaves your machine) and is already committed in qa.jsonl.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ hashFiles('config.yaml') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull subreddit knowledge
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python scripts/ingest_reddit.py

      - name: Rebuild corpus and index
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/build_corpus.py
          python scripts/build_corpus.py --check
          python scripts/build_index.py

      - name: Commit
        run: |
          if [[ -z "$(git status --porcelain data)" ]]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "iiests-faq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus data/index
          git commit -m "reindex: refresh corpus and search index"
          git push origin "HEAD:${GITHUB_REF_NAME}"
