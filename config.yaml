# Non-secret tuning knobs. Secrets live in .env.

subreddit: iiests

models:
  # Cheap + fast: runs over thousands of chat windows, query normalization, reranking.
  fast: llama-3.1-8b-instant
  # Strong: the final user-facing answer. Handles Hindi/Hinglish generation better.
  strong: llama-3.3-70b-versatile
  # Used if `strong` is unavailable / rate limited.
  strong_fallback: openai/gpt-oss-120b

embedding:
  # Resolved against fastembed's TextEmbedding.list_supported_models(); the first
  # available entry wins. MiniLM is the default because it is 0.22 GB and this
  # bot reloads the model on every 10-minute CI run — the larger models below are
  # better but not 5x better, and e5 is only offered in a 2.24 GB size.
  # If you move to an always-on VPS, promote mpnet or e5-large to the top.
  candidates:
    - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2  # 0.22 GB, dim 384
    - sentence-transformers/paraphrase-multilingual-mpnet-base-v2  # 1.0 GB,  dim 768
    - intfloat/multilingual-e5-large                               # 2.24 GB, dim 1024
  # e5 models need these prefixes to work properly. Applied only when the
  # resolved model is an e5 one; blank for everything else.
  query_prefix: "query: "
  passage_prefix: "passage: "

ingest:
  reddit:
    wiki_pages: [index, faq, config/sidebar]
    top_limit: 300
    top_time_filter: all
    min_score: 3
    max_comments_per_post: 3
    min_comment_score: 2
    min_answer_chars: 80
  wiki:
    # The student-run IIEST wiki. Pages are discovered from its sitemap.xml, so
    # new pages are picked up automatically on the next reindex.
    enabled: true
    base_url: https://iiest-town.github.io/
    # Nothing answerable on these: a search box, a photo grid, and editor
    # instructions that would otherwise be extracted as if they were facts.
    skip_paths: [search, gallery, contribute]
    # Half-written sections are common on a young wiki; below this many
    # characters a section is a stub, not an answer.
    min_section_chars: 20
    # Most of the wiki is still a skeleton: section headings whose body is a
    # checklist for whoever fills the page in later ("Add official GAABESU
    # links", "Track academic calendar links"). Those are instructions to
    # editors, not answers to students, and extracting them would produce
    # confident-sounding nonsense. Matched case-insensitively against the whole
    # heading. Delete entries here as the wiki fills in.
    skip_headings:
      - "fill this page"
      - "pages? to fill"
      - "to fill"
      - "how to help"
      - "contribut(e|ing|ors)"
      - "add.*"
      - "maintain"
      - "track"
      - "document"
      - "what belongs here"
      - "listing format"
      - "format"
      - "template"
      - "people"
      - "photos"
      - "sources?"
    # Be a polite crawler. 29 pages, so this costs ~15 seconds total.
    delay_seconds: 0.5

  whatsapp:
    # New conversation window when the gap exceeds this...
    session_gap_minutes: 45
    # ...or when it grows past this many messages.
    session_max_messages: 25
    # Overlap so a question at a window boundary keeps its answer.
    session_overlap: 3

curate:
  # Extracted pairs below this are discarded.
  min_confidence: 0.6
  # Cosine similarity above which two questions are treated as duplicates.
  dedupe_threshold: 0.93
  # The free Groq tier is capped on tokens per minute, not requests, so extra
  # workers cannot buy throughput — they only collide with each other and with
  # the pacer in groq_client. A few in flight is enough to hide request latency.
  # Raise this if you move to a paid tier.
  extract_workers: 3

retrieval:
  bm25_top_k: 30
  dense_top_k: 30
  rrf_k: 60
  rerank_candidates: 12
  final_k: 5

answer:
  # Reply only when the reranked top score clears this...
  min_confidence: 0.7
  # ...and at least this many records support the answer.
  min_supporting: 2
  max_answer_chars: 1800
  footer: |

    ---
    ^(I'm a bot answering from the r/iiests FAQ and community knowledge. I can be
    wrong — check with a human for anything important. Reply `!badbot` to remove this
    comment.)

bot:
  trigger_flairs: [Ask, Question, Admissions, Doubt]
  # Reply to any brand-new post that clears the confidence gate, flair or not.
  auto_reply_unflaired: true
  new_posts_limit: 50
  mentions_limit: 25
  # Never touch anything older than this. Stops a first-run backfill spam disaster.
  max_post_age_minutes: 120
  max_replies_per_run: 3
  max_replies_per_hour: 8
  # Comment bodies containing any of these (from OP or a mod) delete the bot's reply.
  removal_triggers: ["!badbot", "!delete", "bad bot"]
